org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation breaks when the pub cache (C:) and the project
# (D:) are on different drives — the incremental compiler can't relativize source
# paths across drive roots. Disable it globally (authoritative; complements the
# per-task setting in build.gradle.kts).
kotlin.incremental=false
